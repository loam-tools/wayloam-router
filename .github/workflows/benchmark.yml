name: Router Benchmarks

on:
  workflow_dispatch:
    inputs:
      route:
        description: Canonical route
        type: choice
        options: [heidelberg-frankfurt, heidelberg-hamburg, heidelberg-copenhagen, heidelberg-oslo, heidelberg-barcelona, lisbon-helsinki, all]
        default: heidelberg-frankfurt
      profile:
        description: Bicycle profile
        type: choice
        options: [TOURING, DIRECT, BIKEPACKING]
        default: TOURING
      iterations:
        description: Repeated cold/warm pairs (1–10)
        default: '3'
      source:
        description: HTTPS routing-data directory (downloads can total several GB)
        default: https://brouter.de/brouter/segments4/
      data_version:
        description: Dataset label; exact downloaded SHA-256 hashes are recorded separately
        required: true
      max_download_mb:
        description: Maximum advertised download size in MiB
        default: '10240'

permissions:
  contents: read

jobs:
  real-engine:
    name: Repeated local BRouter routes
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ROUTE_ID: ${{ inputs.route }}
      ROUTE_PROFILE: ${{ inputs.profile }}
      ITERATIONS: ${{ inputs.iterations }}
      DATA_SOURCE: ${{ inputs.source }}
      DATA_VERSION: ${{ inputs.data_version }}
      DOWNLOAD_LIMIT: ${{ inputs.max_download_mb }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew -PincludeAndroid=false :router-benchmark:installDist
      - name: Prepare maps and run cold/warm trials
        shell: bash
        run: |
          [[ "$DATA_SOURCE" == https://* ]] || { echo "An HTTPS source is required" >&2; exit 1; }
          router-benchmark/build/install/router-benchmark/bin/router-benchmark \
            --root "$RUNNER_TEMP/router-data" --data-version "$DATA_VERSION" \
            --route "$ROUTE_ID" --profile "$ROUTE_PROFILE" --iterations "$ITERATIONS" \
            --prepare true --source "$DATA_SOURCE" --max-download-mb "$DOWNLOAD_LIMIT" \
            --output benchmark-artifacts/results.jsonl
      - name: Upload measurements, exact data manifest and GPX tracks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayloam-router-${{ inputs.route }}-${{ inputs.profile }}
          path: benchmark-artifacts/
          if-no-files-found: warn
          retention-days: 30

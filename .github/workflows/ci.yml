name: Router CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: router-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Offline JVM tests and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned BRouter baseline
        run: test "$(git -C vendor/brouter rev-parse HEAD)" = "4d2639af77ea5ed9c30d3e400764eb6f9e8522da"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test all JVM modules and package the runnable CLI
        run: ./gradlew -PincludeAndroid=false test :router-benchmark:installDist --stacktrace
      - name: Verify benchmark catalogue
        run: router-benchmark/build/install/router-benchmark/bin/router-benchmark --catalogue
      - name: Verify missing maps produce a failed benchmark artifact
        shell: bash
        run: |
          mkdir -p build/benchmark-smoke
          if router-benchmark/build/install/router-benchmark/bin/router-benchmark \
            --root build/empty-data --data-version missing-fixture --iterations 1 \
            --output build/benchmark-smoke/results.jsonl; then
            echo "Missing routing data incorrectly passed the benchmark" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('build/benchmark-smoke/results.jsonl').read_text().splitlines()]
          assert len(rows) == 2
          assert all(row['status'] == 'failure' and row['failure_code'] == 'MISSING_DATA' for row in rows)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: router-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            build/benchmark-smoke/**
          retention-days: 14

  android:
    name: Android reliability tests
    # Ubuntu 24.04 hosted runners have had recurring emulator/AVD hangs. 26.04 also
    # ships Android command-line tools new enough for current Major.Minor packages.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM access
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Run API 36 instrumentation suite
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: ./gradlew :router-android:connectedDebugAndroidTest --stacktrace

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: router-android-test-reports
          path: |
            router-android/build/reports/androidTests/**
            router-android/build/outputs/androidTest-results/**
          retention-days: 14

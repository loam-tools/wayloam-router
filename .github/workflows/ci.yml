name: Router CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: router-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Offline JVM tests and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify pinned BRouter baseline
        run: test "$(git -C vendor/brouter rev-parse HEAD)" = "4d2639af77ea5ed9c30d3e400764eb6f9e8522da"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test all JVM modules and package the runnable CLI
        run: ./gradlew -PincludeAndroid=false test :router-benchmark:installDist --stacktrace
      - name: Verify benchmark catalogue
        run: router-benchmark/build/install/router-benchmark/bin/router-benchmark --catalogue
      - name: Verify missing maps produce a failed benchmark artifact
        shell: bash
        run: |
          mkdir -p build/benchmark-smoke
          if router-benchmark/build/install/router-benchmark/bin/router-benchmark \
            --root build/empty-data --data-version missing-fixture --iterations 1 \
            --output build/benchmark-smoke/results.jsonl; then
            echo "Missing routing data incorrectly passed the benchmark" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('build/benchmark-smoke/results.jsonl').read_text().splitlines()]
          assert len(rows) == 2
          assert all(row['status'] == 'failure' and row['failure_code'] == 'MISSING_DATA' for row in rows)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: router-test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
            build/benchmark-smoke/**
          retention-days: 14

  android:
    name: Android reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36 emulator
        run: |
          sdkmanager "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0" \
            "system-images;android-36;google_apis;x86_64"
          echo no | avdmanager create avd --force --name wayloam-ci \
            --package "system-images;android-36;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
      - name: Boot emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          nohup emulator -avd wayloam-ci -no-window -noaudio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot -wipe-data > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Run Android instrumentation suite
        run: ./gradlew :router-android:connectedDebugAndroidTest --stacktrace
      - name: Collect emulator log
        if: failure()
        run: cat "$RUNNER_TEMP/emulator.log" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: router-android-test-reports
          path: |
            router-android/build/reports/androidTests/**
            router-android/build/outputs/androidTest-results/**
          retention-days: 14
